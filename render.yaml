services:
  - type: web
    name: cloud-web-analyzer
    env: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt && python -m playwright install --with-deps chromium"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
